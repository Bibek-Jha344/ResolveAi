spring:
  datasource:
    url: ${DATABASE_URL:${SPRING_DATASOURCE_URL}}
    username: ${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME}}
    password: ${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true

logging:
  level:
    root: INFO
    com.resolveai: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
