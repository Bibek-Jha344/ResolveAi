server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: resolveai-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # File upload restrictions
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Database configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resolveai_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Database migrations
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

# Actuator Health & Diagnostics
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Application-specific properties
resolveai:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000}
  security:
    jwt:
      secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  ai:
    provider: ${AI_PROVIDER:fallback} # options: openai, huggingface, fallback
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
    embedding-model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}
    similarity-threshold: 0.65
    max-citations: 3
    chunk-size: 500
    chunk-overlap: 50

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
